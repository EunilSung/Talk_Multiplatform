appId: com.eunilsung.talk
name: 앱을 처음 상태로 띄운다
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- runFlow:
    when:
      platform: iOS
    label: iOS 는 첫 실행에 알림 권한을 묻는다. 시뮬레이터에서는 미리 허용해 둘 수 없어 직접 누른다
    commands:
      - extendedWaitUntil:
          visible: "허용|Allow"
          timeout: 5000
          optional: true
      - tapOn:
          text: "허용|Allow"
          optional: true
- extendedWaitUntil:
    visible:
      id: login_id
    timeout: 10000
    label: 로그인 입력칸이 나타날 때까지 기다린다
- waitForAnimationToEnd:
    timeout: 3000
    label: 입력칸이 1초 동안 미끄러져 올라오므로 다 멈춘 뒤에 누른다 — 도중에 넣은 글자는 사라질 수 있다
