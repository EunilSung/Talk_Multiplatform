appId: com.eunilsung.talk
name: AI 요약 메뉴
tags:
  - smoke
onFlowComplete:
  - runScript:
      file: ../scripts/peer.js
      env:
        ACTION: cleanup
---
- runScript:
    file: ../scripts/peer.js
    env:
      ACTION: setup
- runScript:
    file: ../scripts/peer.js
    env:
      ACTION: sendFile
- runFlow: ../common/login.yaml
- tapOn:
    id: tab_chat
- tapOn: ${output.title}
- assertVisible:
    text: ${output.fileName}
    label: 상대가 보낸 문서 파일 말풍선이 보인다
- runFlow:
    when:
      true: ${typeof AI_AGENT_INSTALLED === 'undefined' || AI_AGENT_INSTALLED !== 'true'}
    label: AI Agent 가 없는 기기 — AI 요약을 누르면 설치 안내가 뜬다. 파일 id 를 아직 몰라 받는 중 안내가 뜨면 다시 누른다
    commands:
      - retry:
          maxRetries: 3
          commands:
            - longPressOn: ${output.fileName}
            - tapOn:
                id: chat_menu_ai_summary
                label: 롱프레스 메뉴에 AI 요약이 보이고 누른다
            - extendedWaitUntil:
                visible:
                  id: toast_ai_agent_not_installed
                timeout: 5000
                label: AI Agent 앱이 설치되어 있지 않다는 토스트가 뜬다(받는 중 토스트는 toast_ai_summary_file_not_ready 라 여기 걸리지 않는다)
- runFlow:
    when:
      true: ${typeof AI_AGENT_INSTALLED !== 'undefined' && AI_AGENT_INSTALLED === 'true'}
    label: AI Agent 가 있는 기기 — AI 요약을 누르면 Talk 를 떠나 AI Agent 가 열린다. 받는 중 안내가 뜨면 Talk 에 남아 다시 누른다
    commands:
      - retry:
          maxRetries: 3
          commands:
            - longPressOn: ${output.fileName}
            - tapOn:
                id: chat_menu_ai_summary
                label: 롱프레스 메뉴에 AI 요약이 보이고 누른다
            - extendedWaitUntil:
                notVisible:
                  id: chat_room_menu
                timeout: 5000
                label: Talk 대화방이 화면에서 내려간다(chat_room_menu 는 Talk 에만 있다. chat_input 은 AI Agent 대화방에도 있어 쓰지 않는다)
      - extendedWaitUntil:
          visible:
            id: "chat_back|dialog_title"
          timeout: 15000
          label: AI Agent 가 열린다 — 같은 계정이면 새 대화방의 chat_back, 아니면 로그인 안내 팝업의 dialog_title(둘 다 AI Agent 에만 있다)
