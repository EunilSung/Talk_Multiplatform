# 릴리스 — v 로 시작하는 태그를 올리면 테스트 → 릴리스 파일 → GitHub 릴리스 → 테스트 서버 배포까지 돈다.
#   1. composeApp/build.gradle.kts 의 versionName·versionCode 를 올려 main 에 커밋한다
#   2. git tag v<versionName> && git push origin v<versionName>
# 릴리스 파일: 서버 배포 묶음(talk-server-*.tar.gz), 로컬 모드 APK, SHA256SUMS.txt.
# APK 는 서버 주소 없이(로컬 모드) 빌드한다. release 환경에 서명 키가 있으면 그 키로, 없으면 디버그 서명으로 만든다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: 태그와 앱 버전 확인
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: 태그가 main 의 커밋이고 versionName 과 같은지 본다
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::태그 $GITHUB_REF_NAME 의 커밋이 main 에 없다. main 에 머지한 커밋에 태그를 단다."
            exit 1
          fi
          name=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' composeApp/build.gradle.kts | head -n 1)
          if [ "v$name" != "$GITHUB_REF_NAME" ]; then
            echo "::error::태그 $GITHUB_REF_NAME 와 versionName($name)이 다르다. versionName·versionCode 를 올려 커밋한 뒤 v$name 태그를 단다."
            exit 1
          fi
          echo "version=$name" >> "$GITHUB_OUTPUT"

  test:
    name: 테스트
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    name: 릴리스 파일 만들기
    needs: [version, test]
    runs-on: ubuntu-24.04
    environment: release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TALK_SERVER_BASE_URL: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Gradle 메모리를 러너에 맞춘다
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
          EOF
      - name: 서버 배포 묶음
        run: |
          DEPLOY_STAGE_ONLY=1 deploy/deploy.sh
          mkdir -p dist
          tar -czf "dist/talk-server-$VERSION.tar.gz" -C build/deploy .
      - name: Android APK (로컬 모드)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
              if [ -z "${!v}" ]; then echo "::error::release 환경에 $v 가 없다 — 서명 비밀값 네 개를 함께 넣는다"; exit 1; fi
            done
            keystore="$RUNNER_TEMP/release.jks"
            trap 'rm -f "$keystore"' EXIT
            (umask 077 && printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore")
            ANDROID_KEYSTORE_FILE="$keystore" ./gradlew :composeApp:assembleRelease --no-build-cache --no-configuration-cache
            cp composeApp/build/outputs/apk/release/composeApp-release.apk "dist/Talk-$VERSION-local-demo.apk"
          else
            echo "::warning::release 환경에 서명 키(ANDROID_KEYSTORE_BASE64)가 없어 디버그 서명 APK 를 만든다. 다음 릴리스에서 업데이트 설치가 되지 않는다."
            ./gradlew :composeApp:assembleDebug
            cp composeApp/build/outputs/apk/debug/composeApp-debug.apk "dist/Talk-$VERSION-local-demo-debug.apk"
          fi
      - name: APK 가 로컬 모드인지 확인
        run: |
          config=composeApp/build/generated/serverConfig/commonMain/kotlin/com/eunilsung/talk/data/remote/server/ServerBuildConfig.kt
          if ! grep -Fxq 'internal const val SERVER_BASE_URL: String = ""' "$config"; then
            echo "::error::APK 에 서버 주소가 들어갔다 — 공개 빌드는 로컬 모드로만 만든다"
            exit 1
          fi
      - name: 체크섬
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/
          retention-days: 7

  release:
    name: GitHub 릴리스 올리기
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: 릴리스 노트
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            if [ -n "$previous" ]; then
              echo "## $previous 이후 바뀐 것"
              git log --no-merges --format='- %s' "$previous..$GITHUB_REF_NAME"
            else
              echo "## 첫 릴리스 — 최근 커밋"
              git log --no-merges --format='- %s' -n 20 "$GITHUB_REF_NAME"
            fi
            echo
            echo "## 파일"
            echo "| 파일 | 내용 |"
            echo "|---|---|"
            for f in dist/*; do
              case "$(basename "$f")" in
                talk-server-*) echo "| \`$(basename "$f")\` | 서버 배포 묶음 — Docker Compose(PostgreSQL · 서버 · Caddy) 설정과 서버 실행본. 서버의 \`~/talk\` 에 풀고 \`.env\` 를 채워 \`docker compose up -d --build\` |" ;;
                *-debug.apk) echo "| \`$(basename "$f")\` | Android 로컬 모드(서버 없이 시연 데이터로 동작) — 디버그 서명이라 이전 버전 위에 업데이트되지 않는다 |" ;;
                *.apk) echo "| \`$(basename "$f")\` | Android 로컬 모드(서버 없이 시연 데이터로 동작) |" ;;
                SHA256SUMS.txt) echo "| \`SHA256SUMS.txt\` | 위 파일들의 SHA-256 |" ;;
              esac
            done
            echo
            echo "iOS 는 서명할 Apple 팀이 정해지지 않아 릴리스 파일이 없습니다. 소스에서 Xcode 로 빌드합니다."
          } > notes.md
          cat notes.md
      - name: 릴리스 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Talk $VERSION" --notes-file notes.md

  deploy:
    name: 테스트 서버 배포
    needs: [version, release]
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ github.ref_name }}
