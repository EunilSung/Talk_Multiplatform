# 운영 구성 — PostgreSQL + 서버 + Caddy(HTTPS). 값은 같은 폴더의 .env 에서 읽는다(.env.example 참고).
# 1GB 인스턴스에 맞춰 DB 와 JVM 메모리를 작게 잡았다.
# Caddy 는 같은 인스턴스의 다른 앱 사이트(~/caddy-sites)도 함께 맡는다 — 80·443 은 Caddy 하나만 쓸 수 있다.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: talk
      POSTGRES_USER: talk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 가 .env 에 없다}
    command: >
      postgres
      -c shared_buffers=48MB
      -c max_connections=20
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c effective_cache_size=128MB
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talk -d talk"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  server:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/talk
      DB_USER: talk
      DB_PASSWORD: ${DB_PASSWORD}
      DB_POOL_SIZE: "5"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      FIREBASE_CREDENTIALS_B64: ${FIREBASE_CREDENTIALS_B64:-}
      SEED_DEMO_ACCOUNTS: ${SEED_DEMO_ACCOUNTS:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
    volumes:
      - files:/data/files
    ports:
      - "127.0.0.1:8080:8080"
    # Caddy 는 공용 네트워크 edge 에도 붙어 있다. 다른 앱의 서비스도 이름이 server 라 겹치지 않는 별칭으로 부른다
    networks:
      default:
        aliases:
          - talk-server
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - server
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN 이 .env 에 없다}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ../caddy-sites:/etc/caddy/sites:ro
    networks:
      - default
      - edge
    logging: *logging

networks:
  edge:
    external: true

volumes:
  db:
  files:
  caddy_data:
  caddy_config:
